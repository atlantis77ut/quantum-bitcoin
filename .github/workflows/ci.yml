name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBOQS_VERSION: "0.15.0"
  LIBOQS_COMMIT: "97f6b86b1b6d109cfd43cf276ae39c2e776aed80" # 0.15.0 etiketinin commit'i

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: liboqs önbelleği
        id: oqs-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          # İkinci dizin ML-DSA-65'i etkin olmayan derlemedir: yalnızca düğümün böyle bir
          # kütüphaneyle açılmadığını sınamak içindir, /usr/local'a kurulmaz.
          path: |
            /tmp/liboqs-install
            /tmp/liboqs-no65
          key: liboqs-${{ env.LIBOQS_COMMIT }}-${{ runner.os }}-no65

      - name: liboqs derle
        if: steps.oqs-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build
          git clone --branch "$LIBOQS_VERSION" --depth 1 https://github.com/open-quantum-safe/liboqs /tmp/liboqs
          test "$(git -C /tmp/liboqs rev-parse HEAD)" = "$LIBOQS_COMMIT"
          cmake -S /tmp/liboqs -B /tmp/liboqs/build -GNinja \
            -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DOQS_USE_OPENSSL=OFF \
            -DOQS_MINIMAL_BUILD="SIG_ml_dsa_65" -DCMAKE_INSTALL_PREFIX=/tmp/liboqs-install
          ninja -C /tmp/liboqs/build install
          cmake -S /tmp/liboqs -B /tmp/liboqs/build-no65 -GNinja \
            -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON -DOQS_USE_OPENSSL=OFF \
            -DOQS_MINIMAL_BUILD="SIG_ml_dsa_44" -DCMAKE_INSTALL_PREFIX=/tmp/liboqs-no65
          ninja -C /tmp/liboqs/build-no65 install

      - name: liboqs kur
        run: |
          sudo cp -r /tmp/liboqs-install/. /usr/local/
          sudo ldconfig

      - name: Bağımlılıklar
        run: go mod download && go mod verify

      - name: Biçim
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Derleme, vet, test
        run: |
          export PKG_CONFIG_PATH="$(go list -m -f '{{.Dir}}' github.com/open-quantum-safe/liboqs-go)/.config:/usr/local/lib/pkgconfig"
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

      - name: Genesis vektörleri (Go kodunu çağırmayan Python hesabı; betiğin kendi sınamaları)
        run: |
          # Yukarıdaki Go testi (TestGenesisVectorFiles) aynı dosyaları Go kodunun hesabıyla
          # karşılaştırır; burada betik onları baştan hesaplar. İkisi birlikte: Go = dosya = betik.
          python3 -I scripts/genesis_vektor.py denetle core/testdata/*_vector.json
          python3 -I scripts/genesis_vektor_test.py
          # Lansman commit'i yalnızca core/mainnet.json ile core/testdata/mainnet_vector.json
          # dosyalarını getirir. Lansman dosyası doluysa vektör var olmalı ve betiğin o dosyadan
          # ürettiğiyle aynı olmalıdır (uret var olan dosyanın üzerine yazmaz, karşılaştırır).
          if [ "$(tr -d ' \t\r\n' < core/mainnet.json)" != "{}" ]; then
            test -f core/testdata/mainnet_vector.json
            python3 -I scripts/genesis_vektor.py uret core/mainnet.json -o core/testdata/mainnet_vector.json
          else
            test ! -e core/testdata/mainnet_vector.json
          fi

      - name: Açılış denetimi uçtan uca (ML-DSA-65'i etkin olmayan liboqs ile düğüm açılmaz)
        run: |
          export PKG_CONFIG_PATH="$(go list -m -f '{{.Dir}}' github.com/open-quantum-safe/liboqs-go)/.config:/usr/local/lib/pkgconfig"
          go build -o /tmp/qbtc-selftest .
          # Denetimden geçen kütüphane: ölçüm kipi denetimden sonra çalışır ve 0 ile çıkar.
          /tmp/qbtc-selftest -network testnet -bench-hashrate 1s > /tmp/selftest-ok.log 2>&1 || { cat /tmp/selftest-ok.log; exit 1; }
          grep -F '"algoritma":"ML-DSA-65"' /tmp/selftest-ok.log
          # ML-DSA-65'siz kütüphane: düğüm 1 ile çıkar ve veri dizinini açmaz. Denetim durdurmasaydı
          # düğüm çalışmayı sürdürür, timeout 124 döndürürdü.
          ls /tmp/liboqs-no65/lib
          rc=0
          timeout 60 env LD_LIBRARY_PATH=/tmp/liboqs-no65/lib /tmp/qbtc-selftest -network regtest \
            -db /tmp/selftest-no65-db > /tmp/selftest-no65.log 2>&1 || rc=$?
          cat /tmp/selftest-no65.log
          test "$rc" -eq 1
          grep -F 'ML-DSA-65 bu liboqs derlemesinde' /tmp/selftest-no65.log
          test ! -e /tmp/selftest-no65-db

      - name: ML-DSA-65 vektörünün OpenSSL ile yeniden üretimi (koşucunun OpenSSL'i desteklemiyorsa bildirimle atlanır)
        run: |
          rc=0
          python3 -I scripts/mldsa65_vektor.py || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::notice title=ML-DSA-65 vektörü::Koşucudaki OpenSSL ML-DSA-65'i desteklemiyor; OpenSSL ile yeniden üretim atlandı. Vektörü liboqs'a karşı Go testi denetler."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi

      - name: OpenCL (pocl, CPU üzerinde)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ocl-icd-opencl-dev opencl-headers pocl-opencl-icd clinfo
          clinfo -l

      - name: GPU kazıcısı (-tags opencl, çekirdek doğruluğu; hız değil)
        env:
          QBTC_REQUIRE_OPENCL: "1"
        run: |
          export PKG_CONFIG_PATH="$(go list -m -f '{{.Dir}}' github.com/open-quantum-safe/liboqs-go)/.config:/usr/local/lib/pkgconfig"
          go build -tags opencl ./...
          go vet -tags opencl ./...
          go test -tags opencl -race -count=1 ./gpu/... ./core/...

      - name: GPU çekirdeği üreteci (Python'da SHA256d doğrulaması + depodakiyle aynı mı)
        run: |
          python3 gpu/gen/genkernel.py /tmp/sha256d.cl
          diff -u gpu/sha256d.cl /tmp/sha256d.cl

      - name: GPU çekirdeği hızı (pocl, yalnızca bilgi; gerçek GPU ölçümü değil)
        run: |
          export PKG_CONFIG_PATH="$(go list -m -f '{{.Dir}}' github.com/open-quantum-safe/liboqs-go)/.config:/usr/local/lib/pkgconfig"
          go test -tags opencl -run '^$' -bench Kernel -benchtime 3x ./gpu/

      - name: Ölçüm betiği uçtan uca (pocl, kısa; A/B dahil; gerçek GPU ölçümü değil)
        env:
          QBTC_OLCUM_SURE: 2s
          QBTC_OLCUM_TEKRAR: "2"
          QBTC_OLCUM_IZIN_CPU: "1"
          QBTC_OLCUM_CIKTI: /tmp/qbtc-olcum.json
        run: |
          bash scripts/gpu-olcum.sh
          python3 -I -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["gpu_hashrate_mi"] is False and r["gpu"]["non_gpu_allowed"] is True, r; print(json.dumps(r, ensure_ascii=False, indent=2))' /tmp/qbtc-olcum.json
